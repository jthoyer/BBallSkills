<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Basketball skill videos and drills for junior players aged 10 to 15, their parents and coaches.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F7F5F2">
  <!-- No favicon asset exists; this stops the browser requesting /favicon.ico. -->
  <link rel="icon" href="data:,">
  <title>BBallSkills</title>

  <!-- Relative paths only: this must work under the /BBallSkills/ subpath. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to main content</a>

  <header class="app-bar">
    <span class="app-bar__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M3 12h18"/></svg>
    </span>
    <p class="app-bar__title">BBall<span>Skills</span></p>
  </header>

  <!-- The router writes each view into #view. It is the <main> landmark and
       is focusable (tabindex="-1") so the skip link lands here. -->
  <main class="app-main" id="view" tabindex="-1"></main>

  <!-- The only live region: filter announcements. Outside #view so a
       repaint never destroys it. -->
  <div id="status" class="visually-hidden" role="status" aria-live="polite"></div>

  <footer class="site-foot">
    <p class="site-foot__safe">No accounts, forms or tracking.</p>
    <p>Videos are public YouTube videos, credited on each drill. Thumbnails load from YouTube.</p>
    <div id="suggest-slot"></div>
  </footer>

  <nav class="tabbar" aria-label="Main">
    <ul class="tabbar__list">
      <li>
        <a class="tab" href="#/" data-tab="drills">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
          </span>
          <span class="tab__label">Drills</span>
        </a>
      </li>
      <li>
        <a class="tab" href="#/positions" data-tab="positions">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/></svg>
          </span>
          <span class="tab__label">Positions</span>
        </a>
      </li>
    </ul>
  </nav>

  <noscript>
    <p class="noscript">This site needs JavaScript turned on to show its drills.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
